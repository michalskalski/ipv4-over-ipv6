[package]
name = "dslite-b4"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "DS-Lite B4 tunnel management daemon"
license = "MIT OR Apache-2.0"
repository = "https://github.com/michalskalski/ipv4-over-ipv6"
readme = "README.md"
keywords = ["dslite", "ipv4-over-ipv6", "networking", "linux", "illumos"]
categories = ["command-line-utilities", "network-programming"]

[features]
default = ["hb46pp"]
hb46pp = ["dep:hb46pp", "dep:rand", "hb46pp/default-client"]

[lib]
name = "dslite_b4"

[[bin]]
name = "dslite-b4"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1.0.102"
libc = "0.2.186"
jiff = { version = "0.2", features = ["serde"] }
serde_json = "1"
hb46pp = { version = "0.1.2", path = "../hb46pp", optional = true, default-features = false }
rand = { version = "0.10.2", optional = true }

[dev-dependencies]
clap_mangen = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink = "0.20.0"
futures-util = "0.3.32"
futures-channel = "0.3.32"
sd-notify = "0.5"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
